{% extends "layout.html" %}

{% block content %}
<div style="padding: 30px;">
    <h2>Edit Invoice #{{ invoice.invoice_number }}</h2>
    <form method="POST">
        <label>Invoice Number</label><br>
        <input type="text" name="invoice_number" value="{{ invoice.invoice_number }}" required><br><br>

        <label for="client_id">Client:</label><br>
        <select name="client_id" id="client_id" required>
            {% for client in clients %}
                <option value="{{ client.id }}" {% if client.id == invoice.client_id %}selected{% endif %}>
                    {{ client.company_name }}
                </option>
            {% endfor %}
        </select><br><br>

        <label>Amount ($)</label><br>
        <input type="number" step="0.01" name="amount" value="{{ invoice.amount }}" required><br><br>

        <label>Issue Date</label><br>
        <input type="date" name="issue_date" value="{{ invoice.issue_date }}" required><br><br>

        <label>Due Date</label><br>
        <input type="date" name="due_date" value="{{ invoice.due_date }}" required><br><br>

        <label>Status</label><br>
        <select name="status">
            <option value="Unpaid" {% if invoice.status == 'Unpaid' %}selected{% endif %}>Unpaid</option>
            <option value="Paid" {% if invoice.status == 'Paid' %}selected{% endif %}>Paid</option>
            <option value="Overdue" {% if invoice.status == 'Overdue' %}selected{% endif %}>Overdue</option>
        </select><br><br>

        <button type="submit">Update Invoice</button>
        <a href="{{ url_for('invoices_list') }}">Cancel</a>
    </form>
</div>
{% endblock %}
