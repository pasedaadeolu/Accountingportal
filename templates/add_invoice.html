{% extends "layout.html" %}

{% block content %}
<div style="padding: 30px;">
    <h1>Generate Invoice</h1>
    <form method="POST">
        <label>Invoice Number</label><br>
        <input type="text" name="invoice_number" value="{{ suggested_inv_num }}" required><br><br>

        <label for="client_id">Client:</label><br>
        <select name="client_id" id="client_id" required>
            <option value="">-- Select Client --</option>
            {% for client in clients %}
                <option value="{{ client.id }}">{{ client.company_name }}</option>
            {% endfor %}
        </select><br><br>

        <label>Amount ($)</label><br>
        <input type="number" step="0.01" name="amount" placeholder="0.00" required><br><br>

        <label>Issue Date</label><br>
        <input type="date" name="issue_date" value="{{ today }}" required><br><br>

        <label>Due Date</label><br>
        <input type="date" name="due_date" required><br><br>

        <label>Status</label><br>
        <select name="status">
            <option value="Unpaid">Unpaid</option>
            <option value="Paid">Paid</option>
            <option value="Overdue">Overdue</option>
        </select><br><br>

        <button type="submit">Save & Generate</button>
        <a href="{{ url_for('invoices_list') }}">Cancel</a>
    </form>
</div>
{% endblock %}
