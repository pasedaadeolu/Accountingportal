{% extends "layout.html" %}

{% block content %}
<div style="padding: 30px;">
    <h2>Edit Client #{{ client.id }}</h2>
    <form method="POST">
        <label>Company Name</label><br>
        <input type="text" name="company_name" value="{{ client.company_name }}" required><br><br>

        <label>Contact Person</label><br>
        <input type="text" name="contact_person" value="{{ client.contact_person }}" required><br><br>

        <label>Email Address</label><br>
        <input type="email" name="email" value="{{ client.email }}" required><br><br>

        <label>Phone Number</label><br>
        <input type="text" name="phone" value="{{ client.phone }}" required><br><br>

        <label>Address</label><br>
        <textarea name="address" rows="3" cols="40">{{ client.address }}</textarea><br><br>

        <button type="submit">Update Client</button>
        <a href="{{ url_for('clients_list') }}">Cancel</a>
    </form>
</div>
{% endblock %}
